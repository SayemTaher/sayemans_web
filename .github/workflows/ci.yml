name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SITE_URL: https://sayemans.org
      - name: Verify prerender output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/products/taalmeester/index.html
          grep -q "<h1" dist/pricing/index.html
